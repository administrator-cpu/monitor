packages:
  - "apps/*"
  - "packages/*"

# Dependency build scripts: the one allow-list is the "pnpm" field in the root package.json.
# pnpm 10 ignores onlyBuiltDependencies here while package.json has a "pnpm" field, so do not
# add a second list in this file.
#
# - bcrypt: allowed; its install step is node-gyp-build, which loads the bundled prebuild
#   (win32-x64 included) and compiles nothing.
# - better-sqlite3 (>=13): ignored. It has a binding.gyp and no install script, so allowing it makes
#   pnpm run `node-gyp rebuild`, which needs a C++ toolchain and fails on the VPS. It loads
#   prebuilds/<platform>-<arch>.node either way.
# - esbuild: ignored. Dev only (tsx, vite); its postinstall only checks the platform binary that
#   the @esbuild/<platform> package already supplies. Production has always run with it ignored.
