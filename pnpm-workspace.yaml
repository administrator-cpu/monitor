packages:
  - "apps/*"
  - "packages/*"

# pnpm 10 blocks dependency build scripts unless allow-listed.
# better-sqlite3 (>=13) and bcrypt ship prebuilt binaries (incl. win32-x64),
# so neither needs a compile step on install. better-sqlite3 has a binding.gyp and no install
# script, so allowing its build makes pnpm run `node-gyp rebuild`, which needs a C++ toolchain and
# fails on the VPS. package.json therefore lists it under ignoredBuiltDependencies; it loads
# prebuilds/<platform>-<arch>.node either way.
onlyBuiltDependencies:
  - esbuild
  - sharp
  - unrs-resolver
