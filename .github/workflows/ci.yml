name: ci
on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm --filter @cc/frontend build
        env:
          NEXT_PUBLIC_API_BASE: http://localhost:4000
      - run: pnpm --filter command-center-watchdog build
      - run: pnpm smoke:watchdog
      - run: pnpm pm2:check
      - run: pnpm agent:bench
      - run: pnpm size:check
