name: Images

# Builds the two images that run on monitored Linux hosts (phase 11, TRD 14.2) and, on main,
# publishes them to GitHub Container Registry:
#   ghcr.io/administrator-cpu/cc-node-agent:{latest,<version>,sha-<commit>}
#   ghcr.io/administrator-cpu/cc-docker-proxy:{latest,<version>,sha-<commit>}
# Pull requests build and smoke-test them without publishing. Never touches the VPS or the hosts:
# a host only changes when its owner runs `docker compose pull`.
on:
  push:
    branches: [main]
    paths:
      - 'apps/node-agent/**'
      - 'apps/docker-proxy/**'
      - 'packages/shared/**'
      - 'pnpm-lock.yaml'
      - '.dockerignore'
      - '.github/workflows/images.yml'
  pull_request:
    paths:
      - 'apps/node-agent/**'
      - 'apps/docker-proxy/**'
      - 'packages/shared/**'
      - 'pnpm-lock.yaml'
      - '.dockerignore'
      - '.github/workflows/images.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: cc-node-agent
            dockerfile: apps/node-agent/Dockerfile
            package: apps/node-agent/package.json
          - name: cc-docker-proxy
            dockerfile: apps/docker-proxy/Dockerfile
            package: apps/docker-proxy/package.json
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: docker build --pull -f ${{ matrix.dockerfile }} -t local/${{ matrix.name }} .

      # The images are checked as they will run: the agent as uid 10001 with no node_modules, refusing
      # to start without its settings; the proxy's configuration accepted by the image's own HAProxy.
      - name: Smoke test cc-node-agent
        if: matrix.name == 'cc-node-agent'
        run: |
          test "$(docker run --rm --entrypoint id local/cc-node-agent -u)" = "10001"
          docker run --rm --entrypoint sh local/cc-node-agent -c 'test ! -e /app/node_modules && test -f /app/dist/main.js'
          set +e
          out=$(docker run --rm --read-only local/cc-node-agent 2>&1); code=$?
          set -e
          echo "$out"
          test "$code" = "2"
          echo "$out" | grep -q 'CC_MONITOR_URL'

      - name: Smoke test cc-docker-proxy
        if: matrix.name == 'cc-docker-proxy'
        run: |
          docker run --rm --entrypoint haproxy local/cc-docker-proxy -c -f /usr/local/etc/haproxy/haproxy.cfg
          test "$(docker run --rm --entrypoint id local/cc-docker-proxy -un)" = "haproxy"
          test "$(docker run --rm --entrypoint sh local/cc-docker-proxy -c 'echo $ALLOW_ACTIONS')" = "0"

      - name: Publish to GHCR
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${{ matrix.name }}"
          version=$(node -p "require('./${{ matrix.package }}').version")
          for tag in "sha-${GITHUB_SHA::7}" "$version" latest; do
            docker tag "local/${{ matrix.name }}" "$image:$tag"
            docker push "$image:$tag"
          done
          digest=$(docker inspect --format '{{index .RepoDigests 0}}' "$image:latest")
          {
            echo "### ${{ matrix.name }}"
            echo "Tags: \`sha-${GITHUB_SHA::7}\`, \`$version\`, \`latest\`"
            echo "Digest: \`$digest\`"
          } >> "$GITHUB_STEP_SUMMARY"
