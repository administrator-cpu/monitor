# cc-docker-proxy: the Docker API as the node agent may use it, and nothing else (TRD 14.4).
#
# The agent reaches Docker only through this proxy, on the internal `cc-internal` network; the
# proxy is the only container that mounts /var/run/docker.sock. Every request is matched against
# the list below; anything else is answered 403 here and never reaches Docker.
#
# Allowed:
#   GET  /_ping, /version                          health
#   GET  /containers/json                          list with labels, state and status text
#   GET  /containers/{id}/stats                    CPU and memory
#   GET  /containers/{id}/logs                     log stream (M3)
#   GET  /events                                   start, stop, die, oom, restart, health_status
#   POST /containers/{id}/start, /stop, /restart   only while ALLOW_ACTIONS=1 (M5)
# each optionally behind an API version prefix such as /v1.47.
#
# Refused, among others: inspect (/containers/{id}/json returns every environment variable),
# archive, export, exec, attach, create, kill, update, any DELETE, images, volumes, networks,
# build, swarm, secrets, plugins, system. Paths with "..", "%" or "//" are refused before any
# matching, so no encoding or path trick can turn an allowed prefix into another endpoint.
#
# The regular expressions are POSIX extended syntax, so they mean the same with or without PCRE.

global
    log stdout format raw local0 info
    maxconn 256

defaults
    mode http
    log global
    option httplog
    timeout connect 5s
    timeout http-request 10s
    # Event and log streams stay open; the agent reconnects when one is closed.
    timeout client 1h
    timeout server 1h

frontend docker
    bind :2375

    acl m_read   method GET HEAD
    acl m_post   method POST
    acl actions_on env(ALLOW_ACTIONS) -m str 1

    acl bad_path path_sub -i .. %
    acl bad_path path_sub //

    acl p_health path_reg ^(/v1\.[0-9]+)?/(_ping|version)$
    acl p_list   path_reg ^(/v1\.[0-9]+)?/containers/json$
    acl p_read   path_reg ^(/v1\.[0-9]+)?/containers/[A-Za-z0-9][A-Za-z0-9_.-]*/(stats|logs)$
    acl p_events path_reg ^(/v1\.[0-9]+)?/events$
    acl p_action path_reg ^(/v1\.[0-9]+)?/containers/[A-Za-z0-9][A-Za-z0-9_.-]*/(start|stop|restart)$

    # Only refusals reach the log; the agent's routine reads (a dozen every 10 s) do not.
    http-request deny deny_status 403 if bad_path
    http-request set-log-level silent if m_read p_health or m_read p_list or m_read p_read or m_read p_events
    http-request allow if m_read p_health or m_read p_list or m_read p_read or m_read p_events
    http-request allow if m_post p_action actions_on
    http-request deny deny_status 403

    default_backend docker

backend docker
    server docker /var/run/docker.sock
